<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>La Kermesse : jeux multijoueurs</title>
  <meta name="description" content="La fête foraine multijoueur dans ton navigateur : 17 jeux, 1 à 8 joueurs, en équipe ou chacun pour soi.">
  <meta name="theme-color" content="#140A26">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-screen="home">
  <canvas id="game"></canvas>
  <div id="ctl-layer"></div>

  <div id="hud" class="hud">
    <div id="ping" class="hud-ping"></div>
    <div class="hud-btns">
      <button id="hud-rules" class="hud-btn" aria-label="Règles">❓</button>
      <button id="hud-emote" class="hud-btn" aria-label="Emotes">😀</button>
      <button id="hud-quit" class="hud-btn" aria-label="Quitter">✕</button>
    </div>
  </div>
  <div id="spectator-banner"></div>
  <div id="emote-bar" class="emote-bar"></div>
  <div id="emote-feed"></div>

  <section id="scr-home" class="screen"></section>
  <section id="scr-lobby" class="screen"></section>
  <section id="scr-results" class="screen"></section>

  <div id="overlay"></div>
  <div id="net-banner"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
